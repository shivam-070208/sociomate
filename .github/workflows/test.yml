name: Test SOCIOMATE on PR

on:
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install
      - name: Generate Prisma client
        run: cd packages/db && bunx prisma generate
      - name: Build packages
        run: bun run build
      - name: Run tests
        run: bun run test